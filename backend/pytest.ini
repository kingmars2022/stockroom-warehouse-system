[pytest]
# Make the backend/ directory importable so `from app...` resolves without
# callers having to set PYTHONPATH by hand.
pythonpath = .
testpaths = tests
addopts =
    --cov=app
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80
    -q
filterwarnings =
    ignore::DeprecationWarning
