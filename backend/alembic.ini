[alembic]
script_location = %(here)s/alembic
# Without this, invoking the bare `alembic` console script (as start.sh does)
# never puts the current directory on sys.path, so env.py's `from app.config
# import ...` fails with ModuleNotFoundError -- reproduced with a fresh
# `docker compose up -d`, where nothing else on the path sets PYTHONPATH.
prepend_sys_path = .
sqlalchemy.url = postgresql+psycopg://stockroom:stockroom@db:5432/stockroom

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
