apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stockroom-api
  namespace: stockroom
  labels:
    app.kubernetes.io/name: stockroom
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stockroom-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
