name: Validate application

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    # Redis runs as a service so the cache path is exercised against a real
    # server in CI, not only against the in-memory fallback. Postgres runs
    # as a service so the row-level SELECT ... FOR UPDATE lock in
    # record_movement can be tested under real concurrency -- every other
    # test in this suite runs on SQLite, which has no row-level locking to
    # exercise.
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockroom_test
          POSTGRES_USER: stockroom
          POSTGRES_PASSWORD: stockroom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockroom -d stockroom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r backend/requirements-dev.txt

      # pytest.ini sets --cov=app and --cov-fail-under=80, so the job fails
      # if coverage regresses below the threshold.
      - name: Run tests with coverage
        working-directory: backend
        run: pytest

      # Second pass against a live Redis: same suite, real backend.
      - name: Run cache tests against live Redis
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/test_cache.py --no-cov -q

      # Third pass against a real Postgres: proves the row lock actually
      # prevents overselling under concurrent access, which SQLite can't test.
      - name: Run the row-lock concurrency test against live PostgreSQL
        working-directory: backend
        env:
          POSTGRES_TEST_URL: postgresql+psycopg://stockroom:stockroom@localhost:5432/stockroom_test
        run: pytest tests/test_concurrency.py --no-cov -q

      # Fourth pass against a real MongoDB: the in-memory event store only
      # approximates Mongo's query semantics, so the payload filters are run
      # against the real query engine to stop the two quietly diverging.
      - name: Run the audit-event tests against live MongoDB
        working-directory: backend
        env:
          MONGO_TEST_URL: mongodb://localhost:27017
        run: pytest tests/test_audit_events.py --no-cov -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore

  docker-compose:
    runs-on: ubuntu-latest
    # The api job above installs requirements and runs pytest directly -- it
    # never runs the container's actual entrypoint. That gap let a real bug
    # through: alembic.ini was missing prepend_sys_path, so start.sh's bare
    # `alembic upgrade head` failed to import app.config and crash-looped the
    # api container on every fresh `docker compose up -d`, invisible to every
    # other job here. This job exists to catch exactly that class of failure.
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Wait for the API to report healthy
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "API did not answer within 60s" >&2
          exit 1
      - name: Show container logs
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary -ignore-missing-schemas infra/k8s/

  terraform:
    runs-on: ubuntu-latest
    # Nothing else here reads the Terraform at all -- the manifests job above
    # covers infra/k8s only -- so a stack could stop parsing and every other
    # job would still pass. This is static checking: `-backend=false` and
    # `validate` need no credentials, reach no account, and create nothing.
    # It catches an undefined reference or a mistyped argument, not a bad plan.
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          # The wrapper rewrites stdout, which makes a failure harder to read.
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive infra/terraform

      # Separate root modules with different providers -- the free-tier one
      # also pulls archive and random -- so each initialises on its own rather
      # than inheriting anything from the other.
      - name: Validate the production stack
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate the free-tier stack
        working-directory: infra/terraform/freetier
        run: |
          terraform init -backend=false -input=false
          terraform validate
